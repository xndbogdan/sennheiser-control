[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/headset",
    "crates/bluetooth",
    "crates/engine",
    "crates/web",
    "app",
    "tools/hsctl",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
headset = { path = "crates/headset" }
bluetooth = { path = "crates/bluetooth" }
engine = { path = "crates/engine" }
thiserror = "2"
log = "0.4"
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# the web app's wasm build (`pnpm core` in web/): small, and not stripped so wasm-bindgen can read its features
[profile.wasm]
inherits = "release"
strip = false
opt-level = "s"
