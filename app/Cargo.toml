[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sennheiser-control"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
engine.workspace = true
sentry = "0.49.5"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "accesskit"] }
egui = "0.36"
egui-phosphor = "0.14"
raw-window-handle = "0.6"
tiny-skia = "0.12"
ab_glyph = "0.2"
crossbeam-channel.workspace = true
log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
winreg = "0.56"
# ponytail: glow on Windows (proven there), wgpu on Linux (glow finds no
# GL config on NVIDIA Wayland; wgpu goes through Vulkan instead).
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "accesskit", "glow"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(unix)'.dependencies]
# ponytail: ksni backend = pure Rust D-Bus tray, no GTK/AppIndicator system deps.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "accesskit", "wgpu"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
notify-rust = "4"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
