[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sennheiser-control"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
engine.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.36"
egui-phosphor = "0.14"
tray-icon = "0.26"
raw-window-handle = "0.6"
tiny-skia = "0.12"
ab_glyph = "0.2"
crossbeam-channel.workspace = true
log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
parking_lot = "0.12"

[build-dependencies]
embed-resource = "3"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
]
