[package]
name = "sennheiser-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WebAssembly bindings of the shared headset core for the web app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
protocol.workspace = true
headset.workspace = true
wasm-bindgen = "0.2.130"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }

[package.metadata.wasm-pack.profile.release]
# keep the build to what wasm-pack ships with; no external wasm-opt download
wasm-opt = false
